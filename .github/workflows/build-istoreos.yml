name: Build iStore OS

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      board:
        description: "选择设备板型 | Select device board (选择 'all' 编译所有板子)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - h3399pc
          - am40
          - dg3399
          - dlfr100
          - fine3399
          - fmx1-pro
          - fnet3399
          - king3399
          - mpc1903
          - sv901-eaio
          - tn3399
          - tpm-312
          - tvi3315a
          - xiaobao-nas
          - zysj-1739a

env:
  REPO_URL: https://github.com/istoreos/istoreos
  # REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        REPO_BRANCH:
          # - istoreos-22.03
          - istoreos-24.10
        ARCHITECTURE:
          - aarch64_cortex-a53
        board: ${{ github.event.inputs.board == 'all' && fromJSON('["h3399pc","am40","dg3399","dlfr100","fine3399","fmx1-pro","fnet3399","king3399","mpc1903","sv901-eaio","tn3399","tpm-312","tvi3315a","xiaobao-nas","zysj-1739a"]') || fromJSON(format('["{0}"]', github.event.inputs.board)) }}
      fail-fast: false
    
    env:
      CONFIG_FILE: ${{ matrix.board }}/.config
      DIY_P1_SH: ${{ matrix.board }}/diy-part1.sh
      DIY_P2_SH: ${{ matrix.board }}/diy-part2.sh

    steps:
    - name: 准备完成
      uses: actions/checkout@main

    - name: 检查服务器配置
      run: |
        echo "若分配的服务器性能不足，务必及时取消，重新运行！"
        echo -e "------------------------------- CPU信息 -------------------------------\n"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo -e "------------------------------- 内存信息 -------------------------------\n"
        echo "已安装内存详细信息: "
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        echo -e "------------------------------- 磁盘信息 -------------------------------\n"
        echo -e "磁盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
        echo "------------------------------- 磁盘详情 -------------------------------\n"
        df -Th

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "------------------------------- 更新并安装依赖 -------------------------------"
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(cat $GITHUB_WORKSPACE/depends/${{ matrix.os }})
        wget https://bootstrap.pypa.io/pip/3.6/get-pip.py
        sudo python3 get-pip.py
        sudo rm -rf get-pip.py
        sudo pip install pyelftools
        echo "------------------------------- 清理Docker镜像和软件 -------------------------------"
        docker image prune -a -f
        sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* adoptopenjdk* mysql* php* mongodb* dotnet* moby* snapd* android* || true
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        echo "------------------------------- 设置工作目录及时区 -------------------------------"
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /mnt/workdir
        sudo chown $USER:$GROUPS /mnt/workdir

    - name: 克隆源码
      working-directory: /mnt/workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b ${{ matrix.REPO_BRANCH }} openwrt
        ln -sf /mnt/workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 缓存构建动作
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: ${{ matrix.os }}-${{ matrix.ARCHITECTURE }}-${{ matrix.REPO_BRANCH }}
        prefix: ${{ github.workspace }}/openwrt

    - name: 加载自定义 feeds
      env:
        FEEDS_CONF_PATH: ${{ env.FEEDS_CONF }}
      run: |
        [ -e $FEEDS_CONF_PATH ] && mv $FEEDS_CONF_PATH openwrt/$FEEDS_CONF
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 加载自定义配置
      run: |
        ls -la openwrt
        [[ -d "files" ]] && mv -f files openwrt/files
        [[ -e "${CONFIG_FILE}" ]] && cp -f ${CONFIG_FILE} openwrt/.config
        chmod +x ${DIY_P2_SH}
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件 [ ${{ matrix.board }} ]
      id: compile
      run: |
        cd openwrt
        echo "=========================================="
        echo "正在编译板子: ${{ matrix.board }}"
        echo "=========================================="
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "FILE_DATE=_$(date +"%Y%m%d-%H%M")" >> $GITHUB_ENV
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: 清理并复制固件到对应目录
      id: clean
      if: ${{ steps.compile.outputs.status == 'success' && !cancelled() }}
      run: |
        # Clean up server space
        cd openwrt/
        [[ -d "output" ]] || mkdir output
        if ls bin/targets/*/*/*.img.gz >/dev/null 2>&1; then
          cp -f bin/targets/*/*/*.img.gz output/
        fi
        
        # 保存 U-Boot 文件（用于手动制作完整 TF 卡镜像）
        echo "🔍 查找并保存 U-Boot 文件..."
        if find build_dir/ -name "idbloader.img" 2>/dev/null | grep -q .; then
          find build_dir/ -name "idbloader.img" -exec cp -v {} output/ \; 2>/dev/null || true
          find build_dir/ -name "u-boot.itb" -exec cp -v {} output/ \; 2>/dev/null || true
          echo "✅ U-Boot 文件已保存到 output/"
        else
          echo "⚠️  未找到 U-Boot 文件（如果设备不需要 U-Boot 可忽略）"
        fi

        rm -rf $(ls . | grep -v "^output$" | xargs) 2>/dev/null

        echo "📁 output/ 目录内容:"
        ls -l output/

        if [ -z "$(ls -A output/)" ]; then
          echo "❌ 未检测到任何固件文件！请检查 .config 是否正确启用了镜像格式。"
          exit 1
        fi

        # Generate sha256sum file
        cd output/
        for file in *; do [[ ! -d "${file}" ]] && sha256sum "${file}" >"${file}.sha"; done

        # Set output information
        df -hT ${PWD}
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: 设置 Release Tag 和构建时间
      run: |
        # 生成带时分的时间戳，便于一天内多次构建区分版本
        BUILD_TIMESTAMP="$(date +%Y.%m.%d-%H%M)"
        BUILD_DATE_DISPLAY="$(date +'%Y.%m.%d %H:%M')"
        
        if [[ "${{ github.event.inputs.board }}" == "all" ]]; then
          # 全部编译：使用月度标签
          RELEASE_TAG="iStoreOS-24.10-RK3399-$(date +%Y.%m)"
        else
          # 单板编译：包含板子名称和完整时间戳
          RELEASE_TAG="iStoreOS-24.10-${{ matrix.board }}-${BUILD_TIMESTAMP}"
        fi
        
        echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
        echo "BUILD_DATE=${BUILD_DATE_DISPLAY}" >> $GITHUB_ENV

    - name: 上传固件
      uses: ncipollo/release-action@main
      if: ${{ steps.clean.outputs.status == 'success' && !cancelled() }}
      with:
        tag: ${{ env.RELEASE_TAG }}
        artifacts: openwrt/output/*
        allowUpdates: true 
        removeArtifacts: false 
        replacesArtifacts: true 
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |  
          ### iStoreOS Image Information  
          - 💻 CPU: rk3399    
          - 📦 设备: ${{ inputs.board }}
          - 📂 源码: ${{ env.REPO_URL }}
          - 🌳 分支: ${{ matrix.REPO_BRANCH }}  
          - ⏱️ 编译时间: ${{ env.BUILD_DATE }}
          - 👤 用户名: root
          - 🔒 密码: password
          
          ### 网络配置说明
          ${{ inputs.board == 'h3399pc' && '- 🌐 网络模式: **双网口路由器模式**
          - 📡 **WAN 口 (eth1)**: PCIe RTL8168 千兆网卡 → 连接上级路由器或光猫
          - 🔌 **LAN 口 (eth0)**: 板载 gmac 网口 → 连接电脑或交换机  
          - 🏠 LAN IP: 192.168.100.1
          - ✅ WAN 口自动从上级路由器获取 IP 地址' || inputs.board == 'fnet3399' && '- 🌐 网络模式: **双网口路由器模式**
          - 📡 **WAN 口 (eth1)** → 连接上级路由器或光猫
          - 🔌 **LAN 口 (eth0)** → 连接电脑或交换机' || inputs.board == 'fine3399' && '- 🌐 网络模式: **双网口路由器模式**
          - 📡 **WAN 口 (eth1)** → 连接上级路由器或光猫
          - 🔌 **LAN 口 (eth0)** → 连接电脑或交换机' || '- 🌐 网络模式: **旁路由模式（单网口）**
          - 🔌 默认网口为 LAN  
          - 📒 需要接入主路由器后进后台查找对应 IP 地址再访问' }}
          
          ### iStoreOS Image Verification  
          - sha256sum   
        draft: false  
        prerelease: false

    - name: 删除自动发布的旧固件
      uses: dev-drprasad/delete-older-releases@v0.3.3
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 15
        delete_tags: true
